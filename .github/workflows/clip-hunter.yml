name: "Klip bul"

on:
  # Gemini's free quota resets at midnight Pacific time (10:00 / 11:00 Türkiye).
  schedule:
    - cron: "20 8 * * *"
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      vod_url:
        description: "Boş bırak: kanaldaki yeni yayınları otomatik bul. Ya da tek bir Kick yayın linki yapıştır."
        required: false
        default: ""
      max_clips:
        description: "Yayın başına en fazla kaç klip"
        default: "15"
      min_score:
        description: "En düşük puan (1-10)"
        default: "6"

permissions:
  contents: write
  issues: write

concurrency:
  group: clip-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg (static build)
        timeout-minutes: 5
        run: |
          curl -sSL -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p "$HOME/ffmpeg" && tar -xf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Install Python packages
        timeout-minutes: 5
        run: pip install -q -r requirements.txt

      # Model answers are remembered, so a run stopped by the daily quota
      # continues where it left off on the next run.
      - name: Restore previous answers
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: answers-${{ github.run_id }}
          restore-keys: answers-

      - name: Find and render clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOD_URL: ${{ inputs.vod_url }}
          MAX_CLIPS: ${{ inputs.max_clips }}
          MIN_SCORE: ${{ inputs.min_score }}
        run: |
          set -o pipefail
          python -u scripts/auto.py 2>&1 | tee run.log

      - name: Save answers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: answers-${{ github.run_id }}

      - name: Remember processed VODs
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state && git commit -m "Update processed VODs" && git push
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f output/ozet.md ]; then cat output/ozet.md >> "$GITHUB_STEP_SUMMARY"; else echo "Çalışma tamamlanamadı, logu kontrol et." >> "$GITHUB_STEP_SUMMARY"; fi
          python scripts/annotate.py

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klipler
          path: output/
          retention-days: 14
          if-no-files-found: ignore
