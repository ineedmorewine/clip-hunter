<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121110">
  <title>lunverra · editör</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="editor.css?v=9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121110'/%3E%3Cpath d='M20 6a10 10 0 1 0 6 18 8 8 0 1 1-6-18z' fill='%23d6a84e'/%3E%3C/svg%3E">
</head>
<body class="editor-page">
  <header class="ed-top">
    <a class="back" href="./" id="back-link"></a>
    <h1 class="ed-title" data-s="title"></h1>
    <div class="ed-actions">
      <span id="export-status" class="muted"></span>
      <button id="export-btn" class="btn" type="button" disabled></button>
    </div>
  </header>

  <section id="open-screen" class="open-screen">
    <div id="picker" class="picker"></div>
    <div class="drop" id="drop">
      <h2 data-s="openTitle"></h2>
      <p id="open-hint" class="muted"></p>
      <p id="open-download"></p>
      <label class="btn">
        <span data-s="openPick"></span>
        <input type="file" id="base-file" accept="video/*" hidden>
      </label>
    </div>
  </section>

  <main id="editor" class="ed-main" hidden>
    <section class="ed-stage">
      <div class="canvas-wrap"><canvas id="canvas" width="1080" height="1920"></canvas></div>
      <div class="transport">
        <button id="play-btn" class="btn" type="button"></button>
        <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="time">
        <span id="time" class="tc">0:00.0 / 0:00.0</span>
      </div>
      <p class="muted small" data-s="dragHint"></p>
    </section>

    <aside class="ed-panel">
      <div class="tabs" role="tablist" id="panel-tabs"></div>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <section class="ed-timeline">
      <div class="tl-bar">
        <div id="tl-toolbar" class="tl-toolbar"></div>
        <div id="tl-inspector" class="tl-inspector"></div>
      </div>
      <div id="tl-scroll" class="tl-scroll"><div id="tl-inner" class="tl-inner"></div></div>
    </section>
  </main>

  <script src="editor.js?v=9"></script>
</body>
</html>
